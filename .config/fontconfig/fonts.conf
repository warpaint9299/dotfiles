<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="pattern">
		<test name="family">
		  <string>sans</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
            <string>Comic Code</string>
		</edit>
    </match>
    <match target="pattern">
		<test name="family">
		  <string>sans-serif</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
            <string>Comic Code</string>
		</edit>
    </match>
    <match target="pattern">
		<test name="family">
		  <string>monospace</string>
		</test>
		<edit name="family" mode="assign" binding="strong">
            <string>Comic Code</string>
		</edit>
    </match>
    <match>
        <test name="lang" compare="contains">
            <string>en</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Comic Code</string>
            <string>Comic Mono</string>
        </edit>
    </match>

    <match>
        <test name="lang" compare="contains">
            <string>zh</string>
        </test>
        <edit name="family" mode="prepend">
            <string>LXGW WenKai Mono Medium</string>
            <string>LXGW WenKai Mono TC Medium</string>
            <string>Gen Jyuu Gothic X</string>
            <string>Gen Jyuu Gothic X Monospace</string>
        </edit>
    </match>

	<match target="pattern">
        <test name="prgname" compare="eq">
            <string>kitty</string>
        </test>
        <edit name="family" mode="prepend" >
            <string>Comic Code</string>
            <string>Comic Mono</string>
            <string>LXGW WenKai Mono TC Medium</string>
            <string>LXGW WenKai Mono Medium</string>
            <string>Gen Jyuu Gothic X</string>
            <string>Gen Jyuu Gothic X Monospace</string>
        </edit>
    </match>

	<match target="pattern">
        <test name="prgname" compare="eq">
            <string>st</string>
        </test>
        <edit name="family" mode="prepend" >
            <string>Comic Code</string>
            <string>Comic Mono</string>
            <string>LXGW WenKai Mono TC Medium</string>
            <string>LXGW WenKai Mono Medium</string>
            <string>Gen Jyuu Gothic X</string>
            <string>Gen Jyuu Gothic X Monospace</string>
        </edit>
    </match>

	<match target="pattern">
        <test name="prgname" compare="eq">
        	<string>okular</string>
        </test>
        <edit name="family" mode="prepend" >
            <string>Comic Code</string>
            <string>Comic Mono</string>
            <string>LXGW WenKai Mono TC Medium</string>
            <string>LXGW WenKai Mono Medium</string>
            <string>Gen Jyuu Gothic X</string>
            <string>Gen Jyuu Gothic X Monospace</string>
        </edit>
    </match>

	<match target="pattern">
        <test name="prgname" compare="eq">
        	<string>goldendict</string>
        </test>
        <edit name="family" mode="prepend" >
            <string>Comic Code</string>
            <string>Comic Mono</string>
            <string>LXGW WenKai Mono TC Medium</string>
            <string>LXGW WenKai Mono Medium</string>
            <string>Gen Jyuu Gothic X</string>
            <string>Gen Jyuu Gothic X Monospace</string>
        </edit>
    </match>
</fontconfig>
